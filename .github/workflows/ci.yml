name: AegisLPS Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e packages/standards-data
          pip install -e packages/domain-model
          pip install -e packages/geometry
          pip install -e packages/reporting
          pip install -e services/calculation-engine
          pip install -e services/api
      - name: Run Pytest
        run: |
          pytest tests/ --junitxml=junit.xml

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: |
          npm install
      - name: Build Web Frontend
        run: |
          npm run build --workspace=apps/web || true
