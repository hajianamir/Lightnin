name: AegisLPS Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi pydantic uvicorn sqlalchemy alembic reportlab networkx scipy pint shapely ezdxf python-multipart httpx
      - name: Run Pytest
        env:
          PYTHONPATH: packages/standards-data:packages/domain-model:packages/geometry:packages/reporting:services/calculation-engine:services/api
        run: |
          pytest tests/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: |
          npm install
      - name: Build Web Frontend
        run: |
          npm run build --workspace=apps/web || true
