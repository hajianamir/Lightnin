[package]
name = "aegislps-desktop"
version = "1.0.0-draft"
description = "AegisLPS Native Desktop Host (Tauri 2 + Loopback Python Sidecar)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aegislps_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-shell = "=2.6.0"
tauri-plugin-http = "=2.9.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
getrandom = "=0.2.15"
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
